name: Nightly Scrape

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape all regions via Render
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: |
          for REGION in "Graz" "Wien" "Kärnten" "Linz" "Murtal" "Salzburg" "Traunviertel"; do
            echo "Scraping $REGION..."
            curl -sf -X POST \
              -H "Authorization: Bearer $SCRAPE_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"region\": \"$REGION\"}" \
              --max-time 600 \
              "$RENDER_URL/admin/scrape-region"
            echo ""
          done
