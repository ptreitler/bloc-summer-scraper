name: Nightly Scrape

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (may be sleeping on free tier)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Pinging $RENDER_URL ..."
          curl --retry 5 --retry-delay 15 --retry-all-errors -sf "$RENDER_URL/admin/ping"
          echo "Render is up."

      - name: Trigger scrapes (staggered — 3 min apart so regions run sequentially)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: |
          REGIONS=("Graz" "Wien" "Kärnten" "Linz" "Murtal" "Salzburg" "Traunviertel")
          for i in "${!REGIONS[@]}"; do
            REGION="${REGIONS[$i]}"
            echo "Triggering scrape for $REGION..."
            curl --fail-with-body -X POST \
              -H "Authorization: Bearer $SCRAPE_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"region\": \"$REGION\"}" \
              --max-time 30 \
              "$RENDER_URL/admin/scrape-region"
            echo ""
            # Wait before triggering the next region so they don't scrape in parallel
            if [ $i -lt $((${#REGIONS[@]} - 1)) ]; then
              echo "Waiting 3 minutes before next region..."
              sleep 180
            fi
          done

      - name: Wait for background scrapes to complete
        run: |
          echo "Waiting 10 minutes for all region scrapes to finish..."
          sleep 600

      - name: Check scrape status
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Final scrape status:"
          curl -sf "$RENDER_URL/admin/scrape-status"
